# Acme Air Deployment Configuration
# Defines deployment order and instance counts for each microservice

orchestrator_ip: "${ORCHESTRATOR_IP}"  # Can be overridden by environment variable

# Deployment order - services are deployed in this sequence to respect dependencies
# NOTE: MongoDB is stateful and will always deploy only 1 instance regardless of config
#       The deployment script automatically enforces this constraint
deployment_order:
  - service: mongodb
    instances: 1  # Stateful - always limited to 1 instance
    wait_time: 120  # seconds to wait after deployment before next service
    readiness_check:
      enabled: true
      host: "10.30.10.11"
      port: 27017
      type: "tcp"  # TCP connection check for MongoDB
      timeout: 5  # seconds
      retries: 24  # number of retry attempts (24 * 5s = 120s max)
      retry_delay: 5  # seconds between retries

  - service: authservice
    instances: 1  # Stateless - can be scaled (e.g., 2, 3, 4)
    wait_time: 120
    readiness_check:
      enabled: true
      endpoint: "http://10.30.10.1:9443"  # Check if auth service port is responding
      type: "http"
      expected_status: [200, 404]  # Accept 200 or 404 (service is up even if endpoint doesn't exist)
      timeout: 5
      retries: 24
      retry_delay: 5

  - service: acmeair
    instances: 1  # Stateless - can be scaled (e.g., 2, 3, 4)
    wait_time: 120
    readiness_check:
      enabled: true
      endpoint: "http://10.30.10.2:9080"  # Check main page or any endpoint
      type: "http"
      expected_status: [200, 302, 404]  # Accept various HTTP responses indicating service is up
      timeout: 5
      retries: 24
      retry_delay: 5

# Database initialization - run after all services are deployed
post_deployment:
  initialize_db: true
  db_endpoint: "http://10.30.10.2:9080/rest/api/loader/load"
  validation_endpoint: "http://10.30.10.2:9080/rest/api/login"
  validation_credentials:
    login: "uid0@email.com"
    password: "password"
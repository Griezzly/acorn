syntax = "proto3";
option go_package = "./;grpc";

import "google/protobuf/empty.proto";

package benchmark;

service BenchmarkOrchestrator {
  rpc RegisterNode(NodeInfo) returns (RegisterResponse);
  rpc CollectLogs(LogRequest) returns (LogData);
  rpc StartBenchmark(google.protobuf.Empty) returns (ExecutionAck);
}

message NodeInfo {
  string node_id = 1;
  string ip = 2;
  string specs = 3;
}

message RegisterResponse {
  string status = 1;
}

message ExecutionPlan {
  string node_id = 1;
  string plan = 2;
  int64 start_time = 3; // Unix epoch in milliseconds
}

message ExecutionAck {
  string status = 1;
}

message LogRequest {
  string node_id = 1;
}

message LogData {
  string logs = 1;
}

service BenchmarkNode {
  rpc ReceivePlan(ExecutionPlan) returns (ExecutionAck);
  rpc SyncNode(google.protobuf.Empty) returns (ExecutionAck);
}
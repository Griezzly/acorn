server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://${loki_url}:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  # Scrape Oakestra application container logs
  - job_name: oakestra-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: oakestra-containers
          host: ${worker_hostname}
          __path__: /var/log/oakestra/containers/*

    pipeline_stages:
      # Extract container name from file path
      - regex:
          source: filename
          expression: '/var/log/oakestra/containers/(?P<container_name>[^/]+)$'

      # Add container name as label
      - labels:
          container_name:

      # Extract service name by removing .instance.X suffix
      # Example: acmeair.acmeair.mongodb.acmeair.instance.0 -> acmeair.acmeair.mongodb.acmeair
      - regex:
          source: container_name
          expression: '^(?P<service_name>.+)\.instance\.\d+$'

      # Add service name as label
      - labels:
          service_name:

      # Remove ANSI color codes and parse log content
      # This handles both structured logs (with timestamps) and plain text
      - replace:
          expression: '\x1b\[\d+m'
          replace: ''

      # Try to parse structured logs with timestamps
      # Format: [2025-11-19 12:06:26.039] [INFO] authservice_app - message
      - regex:
          expression: '^\[(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\] \[(?P<level>[^\]]+)\] (?P<logger>[^\-]+) - ?(?P<message>.*)'

      # Parse timestamp if available
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000'

      # Add level and logger as labels if present
      - labels:
          level:
          logger:

  # Scrape Oakestra NetManager logs
  - job_name: oakestra-netmanager
    static_configs:
      - targets:
          - localhost
        labels:
          job: netmanager
          host: ${worker_hostname}
          __path__: /var/log/oakestra/netmanager.log

    pipeline_stages:
      # Parse two formats:
      # 1. INFO-2025/10/15 10:00:05 file.go:59: message
      # 2. 2025/10/15 10:00:05 message
      - regex:
          expression: '^(?:(?P<level>INFO|WARN|ERROR|DEBUG)-)?(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2})(?: [^:]+:)? (?P<message>.*)$'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: '2006/01/02 15:04:05'

  # Scrape Oakestra NodeEngine logs
  - job_name: oakestra-nodeengine
    static_configs:
      - targets:
          - localhost
        labels:
          job: nodeengine
          host: ${worker_hostname}
          __path__: /var/log/oakestra/nodeengine.log

    pipeline_stages:
      # Parse format: INFO-2025/11/19 11:46:30 file.go:104: message
      - regex:
          expression: '^(?:(?P<level>INFO|WARN|ERROR|DEBUG)-)?(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2})(?: [^:]+:)? (?P<message>.*)$'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: '2006/01/02 15:04:05'
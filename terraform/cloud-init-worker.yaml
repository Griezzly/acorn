#cloud-config

# Oakestra Worker Cloud-Init Configuration
# This configuration initializes worker nodes and waits for orchestrator

package_update: true
package_upgrade: false

packages:
  - curl
  - netcat
  - jq
  - ntpdate
  - unzip

# Create initialization script from template
write_files:
  - path: /opt/worker-init.sh
    permissions: '0755'
    encoding: b64
    content: ${worker_script}

  # Promtail configuration for containerd logs
  - path: /etc/promtail/config.yml
    permissions: '0644'
    encoding: b64
    content: ${promtail_config}

  # Promtail systemd service
  - path: /etc/systemd/system/promtail.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Promtail service for Oakestra container logs
      After=network.target

      [Service]
      Type=simple
      User=root
      ExecStart=/usr/local/bin/promtail -config.file=/etc/promtail/config.yml
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target

  # Node Exporter systemd service
  - path: /etc/systemd/system/node_exporter.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Node Exporter for Prometheus
      After=network.target

      [Service]
      Type=simple
      User=root
      ExecStart=/usr/local/bin/node_exporter --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/) --collector.netclass.ignored-devices=^(veth.*|br.*|docker.*|virbr.*|lo)$$
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target

# System configuration
runcmd:
  # Update system clock
  - timedatectl set-ntp true

  # Set hostname with worker ID
  - hostnamectl set-hostname oakestra-worker-${worker_id}

  # Configure logging
  - mkdir -p /var/log
  - chmod 755 /var/log

  # Install Promtail (but don't start yet - will start after Tailscale is ready)
  - mkdir -p /etc/promtail
  - cd /tmp && curl -L -O "https://github.com/grafana/loki/releases/download/v2.9.2/promtail-linux-amd64.zip"
  - cd /tmp && unzip -o promtail-linux-amd64.zip
  - chmod +x /tmp/promtail-linux-amd64
  - mv /tmp/promtail-linux-amd64 /usr/local/bin/promtail

  # Install Node Exporter (but don't start yet - will start after Tailscale is ready)
  - cd /tmp && curl -L -O "https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz"
  - cd /tmp && tar xvfz node_exporter-1.7.0.linux-amd64.tar.gz
  - mv /tmp/node_exporter-1.7.0.linux-amd64/node_exporter /usr/local/bin/
  - chmod +x /usr/local/bin/node_exporter
  - systemctl daemon-reload

  # Run worker initialization with Tailscale auth key (NodeEngine runs as daemon, so script can exit)
  # This script will start Promtail and Node Exporter after Tailscale is connected
  - TAILSCALE_AUTH_KEY="${tailscale_auth_key}" /opt/worker-init.sh

# Set timezone
timezone: UTC

# Configure logging for cloud-init
output:
  all: '| tee -a /var/log/cloud-init-output.log'